<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#EEF2FF" rx="100"/>
  <!-- Body / Blazer (dark blue) -->
  <ellipse cx="100" cy="195" rx="68" ry="45" fill="#1E3A8A"/>
  <rect x="32" y="155" width="136" height="50" fill="#1E3A8A"/>
  <!-- Neck -->
  <rect x="88" y="128" width="24" height="22" fill="#D4A77A"/>
  <!-- Collar shirt (white) -->
  <polygon points="88,138 100,152 112,138 116,155 84,155" fill="#FFFFFF"/>
  <!-- Head -->
  <ellipse cx="100" cy="112" rx="38" ry="40" fill="#D4A77A"/>
  <!-- Hijab base (navy) -->
  <ellipse cx="100" cy="95" rx="45" ry="38" fill="#1E3A8A"/>
  <!-- Hijab inner face frame -->
  <ellipse cx="100" cy="108" rx="30" ry="34" fill="#D4A77A"/>
  <!-- Hijab top/crown -->
  <ellipse cx="100" cy="78" rx="38" ry="22" fill="#1E40AF"/>
  <!-- Hijab side drape left -->
  <path d="M55,100 Q48,135 60,160 Q72,155 78,138 Q68,120 72,100 Z" fill="#1E40AF"/>
  <!-- Hijab side drape right -->
  <path d="M145,100 Q152,135 140,160 Q128,155 122,138 Q132,120 128,100 Z" fill="#1E40AF"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="108" rx="4.5" ry="4" fill="#3D2A1A"/>
  <ellipse cx="112" cy="108" rx="4.5" ry="4" fill="#3D2A1A"/>
  <!-- Eye shine -->
  <circle cx="90" cy="106.5" r="1.2" fill="white"/>
  <circle cx="114" cy="106.5" r="1.2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M82,101 Q88,98.5 94,101" stroke="#3D2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M106,101 Q112,98.5 118,101" stroke="#3D2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="116" rx="3" ry="2" fill="#B8835A"/>
  <!-- Smile -->
  <path d="M90,124 Q100,131 110,124" stroke="#B8835A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks blush -->
  <ellipse cx="80" cy="120" rx="8" ry="5" fill="#E8A0A0" opacity="0.4"/>
  <ellipse cx="120" cy="120" rx="8" ry="5" fill="#E8A0A0" opacity="0.4"/>
</svg>